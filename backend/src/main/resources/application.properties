#Uygulama
spring.application.name=stok-takip-backend

#PostgreSQL bağlantısı
spring.datasource.url=jdbc:postgresql://localhost:5432/stock_db
spring.datasource.username=stock_app
spring.datasource.password=${DB_PASSWORD}

#JPA ve Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#sunucu
server.port=8080

#Bu ayar, web isteği tamamlandıktan sonra veritabanı oturumunun açık kalmasına dayanan davranışı kapatır. 
#Bunun yerine servis katmanında işlemleri uygun transaction sınırlarıyla yöneteceğiz.
spring.jpa.open-in-view=false
